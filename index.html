<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#09070a" />
    <title>KTMN</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap");
      :root {
        --bg: #09070a;
        --card: rgba(255, 255, 255, 0.075);
        --line: rgba(255, 255, 255, 0.14);
        --text: #fff8fb;
        --muted: #b9adb3;
        --accent: #ff5c86;
        --accent2: #ff8cab;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 50% 25%,
            rgba(255, 92, 134, 0.16),
            transparent 30%
          ),
          radial-gradient(
            circle at 15% 85%,
            rgba(139, 75, 255, 0.1),
            transparent 25%
          ),
          var(--bg);
        color: var(--text);
        font-family: "DM Sans", system-ui, sans-serif;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .bg-heart {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.12;
      }
      .bg-heart span {
        position: absolute;
        color: #ff7195;
        font-size: 18px;
        animation: float 7s infinite ease-in-out;
      }
      .bg-heart span:nth-child(1) {
        left: 12%;
        top: 18%;
        animation-delay: -2s;
      }
      .bg-heart span:nth-child(2) {
        right: 15%;
        top: 28%;
        font-size: 12px;
        animation-delay: -4s;
      }
      .bg-heart span:nth-child(3) {
        left: 24%;
        bottom: 20%;
        font-size: 11px;
        animation-delay: -1s;
      }
      .bg-heart span:nth-child(4) {
        right: 25%;
        bottom: 14%;
        animation-delay: -5s;
      }
      .wrap {
        width: min(92vw, 520px);
        position: relative;
        z-index: 2;
      }
      .card {
        padding: 42px 30px 34px;
        border: 1px solid var(--line);
        border-radius: 30px;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.09),
          rgba(255, 255, 255, 0.035)
        );
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(18px);
        text-align: center;
      }
      .heart {
        width: 74px;
        height: 74px;
        margin: 0 auto 25px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255, 92, 134, 0.11);
        border: 1px solid rgba(255, 140, 171, 0.24);
        box-shadow: 0 0 45px rgba(255, 92, 134, 0.12);
      }
      .heart svg {
        width: 35px;
        fill: none;
        stroke: var(--accent2);
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        font:
          600 clamp(30px, 8vw, 43px)/1.08 "Playfair Display",
          serif;
        margin: 0 0 15px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 auto;
        color: var(--muted);
        line-height: 1.65;
        font-size: 15px;
        max-width: 380px;
      }
      .divider {
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--line),
          transparent
        );
        margin: 28px 0;
      }
      .label {
        display: block;
        text-align: left;
        font-size: 12px;
        color: #cbbdc3;
        margin: 0 0 8px 3px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        outline: 0;
        border-radius: 15px;
        background: rgba(0, 0, 0, 0.22);
        color: white;
        padding: 15px 16px;
        font: 500 16px "DM Sans";
        transition: 0.2s;
      }
      input:focus {
        border-color: rgba(255, 140, 171, 0.65);
        box-shadow: 0 0 0 4px rgba(255, 92, 134, 0.08);
      }
      button {
        width: 100%;
        margin-top: 12px;
        border: 0;
        border-radius: 15px;
        padding: 15px 18px;
        background: linear-gradient(135deg, var(--accent), #ff7b9d);
        color: #fff;
        font: 600 15px "DM Sans";
        cursor: pointer;
        box-shadow: 0 10px 28px rgba(255, 92, 134, 0.2);
        transition: 0.2s;
      }
      button:active {
        transform: scale(0.985);
      }
      .hint {
        min-height: 21px;
        margin-top: 12px;
        font-size: 13px;
        color: #ff9db5;
      }
      .secret {
        margin-top: 25px;
        font-size: 11px;
        color: #655b61;
        letter-spacing: 0.16em;
        cursor: default;
        user-select: none;
      }
      .hidden {
        display: none;
      }
      .video-wrap {
        margin-top: 25px;
        border-radius: 19px;
        overflow: hidden;
        background: #000;
        border: 1px solid var(--line);
        aspect-ratio: 16/9;
      }
      .video-wrap iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .foot {
        margin-top: 20px;
        font-size: 11px;
        color: #625a5f;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(-5deg);
        }
        50% {
          transform: translateY(-13px) rotate(6deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-heart">
      <span>♡</span><span>♡</span><span>♡</span><span>♡</span>
    </div>
    <main class="wrap">
      <section class="card" id="gate">
        <div class="heart">
          <svg viewBox="0 0 24 24">
            <path
              d="M20.8 8.9c0 5.2-8.8 10.1-8.8 10.1S3.2 14.1 3.2 8.9A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.8 2.3Z"
            />
          </svg>
        </div>
        <h1>Você ainda não está pronta para assistir.</h1>
        <p>
          Algumas coisas precisam ser descobertas antes.<br />Quando chegar a
          hora, você vai saber.
        </p>
        <div class="divider"></div>
        <label class="label" for="password">Senha</label>
        <input
          id="password"
          type="password"
          autocomplete="off"
          placeholder="Digita a senha meu amor 🤍"
        />
        <button id="enter">Continuar</button>
        <div class="hint" id="hint"></div>
        <div class="secret">QUE CHATCHURA ISSO NÉ 😂</div>
        <div class="foot">10.10.25 → 10.10.26</div>
      </section>

      <section class="card hidden" id="reveal">
        <div class="heart">
          <svg viewBox="0 0 24 24">
            <path
              d="M20.8 8.9c0 5.2-8.8 10.1-8.8 10.1S3.2 14.1 3.2 8.9A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.8 2.3Z"
            />
          </svg>
        </div>
        <h1>Agora sim.</h1>
        <p>
          Feliz 1 ano, Tutu.<br />Eu espero que você goste do que vem a seguir.
        </p>
        <div class="video-wrap">
          <iframe
            id="video"
            src=""
            title="Nosso vídeo"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
      </section>
    </main>
    <script>
      /* ALTERE SOMENTE ESTAS DUAS LINHAS QUANDO FOR FINALIZAR */
      const PASSWORD = "1ANO";
      const VIDEO_URL = "https://www.youtube.com/embed/VIDEO_ID";

      const input = document.getElementById("password"),
        button = document.getElementById("enter"),
        hint = document.getElementById("hint");
      function unlock() {
        if (input.value.trim() === PASSWORD) {
          document.getElementById("gate").classList.add("hidden");
          document.getElementById("reveal").classList.remove("hidden");
          document.getElementById("video").src = VIDEO_URL;
        } else {
          hint.textContent = "Ainda não. Tem uma resposta esperando por você.";
          input.select();
        }
      }
      button.addEventListener("click", unlock);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") unlock();
      });
    </script>
  </body>
</html>
